# Builds the VST3 (and Standalone app) on Windows and macOS and uploads them as artifacts.
# Pushing a version tag (for example v1.0.0) also publishes a GitHub Release with the zips
# and the Windows installer attached.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS Universal
            os: macos-15

    steps:
      - uses: actions/checkout@v4

      # PRODUCT_NAME, PRODUCT_TARGET, PRODUCT_VERSION, ... from the top of CMakeLists.txt.
      - name: Read product identity
        shell: bash
        run: bash scripts/product-info.sh | tee -a "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.tool-versions
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # JUCE links the WebView2 loader statically; it needs the SDK from NuGet.
      - name: Fetch WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "1.0.1901.177"
          $dir = "$env:RUNNER_TEMP\nuget\Microsoft.Web.WebView2.$version"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$version" -OutFile "$env:RUNNER_TEMP\webview2.zip"
          Expand-Archive "$env:RUNNER_TEMP\webview2.zip" -DestinationPath $dir
          "WEBVIEW2_ARGS=-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$env:RUNNER_TEMP\nuget" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${WEBVIEW2_ARGS:-}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Engine tests
        run: ctest --test-dir build -C Release --output-on-failure

      # One double-click installer for people who don't use GitHub or build tools.
      # Runs after the tests, so only a build that passed gets packaged.
      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile installer\windows\MicrosoftEdgeWebview2Setup.exe
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          & $iscc.FullName "/DAppName=$env:PRODUCT_NAME" "/DAppFileName=$env:PRODUCT_TARGET" "/DAppPublisher=$env:PRODUCT_COMPANY" `
            "/DAppId=$env:PRODUCT_WINDOWS_APP_ID" "/DAppVersion=$env:PRODUCT_VERSION" `
            "/DBuildDir=$pwd\build\plugin\${env:PRODUCT_TARGET}_artefacts\Release" installer\windows\Installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # One zip per platform, named with the version, for sending to testers and for releases.
      # macOS uses ditto, which keeps the executable permissions and bundle symlinks that a
      # plain artifact upload loses (without them the plugin won't load).
      - name: Package
        shell: bash
        run: |
          name="$PRODUCT_NAME"
          base="$PRODUCT_TARGET-$PRODUCT_VERSION"
          out="build/plugin/${PRODUCT_TARGET}_artefacts/Release"
          mkdir -p dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            stage="dist/$base-macOS"
            mkdir -p "$stage"
            cp -R "$out/VST3/$name.vst3" "$out/Standalone/$name.app" "$stage/"
            # No Developer ID yet, so sign ad hoc: Apple Silicon refuses to load unsigned code.
            codesign --force --deep --sign - "$stage/$name.vst3" "$stage/$name.app"
            sed "s/{{PRODUCT_NAME}}/$name/g" installer/macos/READ-ME-FIRST.txt > "$stage/READ-ME-FIRST.txt"
            ditto -c -k --sequesterRsrc --keepParent "$stage" "dist/$base-macOS.zip"
            rm -rf "$stage"
          else
            stage="dist/$base-Windows"
            mkdir -p "$stage"
            cp -R "$out/VST3/$name.vst3" "$out/Standalone/$name.exe" "$stage/"
            (cd dist && 7z a -tzip "$base-Windows.zip" "$base-Windows" > /dev/null)
            rm -rf "$stage"
            cp installer/windows/Output/*.exe dist/
          fi
          ls -l dist

      - name: Upload installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_NAME }} - Windows Installer
          path: dist/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_NAME }} - ${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  # Runs only for version tags, after both platforms built and passed their tests.
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read product identity
        run: bash scripts/product-info.sh | tee -a "$GITHUB_ENV"

      - name: Check the tag matches the version in CMakeLists.txt
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$PRODUCT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match PRODUCT_VERSION $PRODUCT_VERSION in CMakeLists.txt. Raise PRODUCT_VERSION first, then tag v$PRODUCT_VERSION."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{{PRODUCT_TARGET}}/$PRODUCT_TARGET/g" installer/release-notes-header.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$PRODUCT_NAME ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes-file release-notes.md
