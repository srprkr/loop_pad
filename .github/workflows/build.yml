# Typechecks and builds the web app, and uploads dist/ as an artifact.
# Runs on Linux only (the cheapest runner); docs-only changes are skipped.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci
      - run: npm run build # tsc --noEmit && vite build

      - uses: actions/upload-artifact@v4
        with:
          name: loop-pad-web
          path: dist/
          if-no-files-found: error
